url: https://saketlab.github.io/varunayanR/
template:
  bootstrap: 5
  bootswatch: flatly
  bslib:
    primary: "#0054a6"
    secondary: "#00a651"
    success: "#28a745"
    info: "#17a2b8"
    warning: "#ffc107"
    danger: "#dc3545"
    base_font: {google: "Roboto"}
    heading_font: {google: "Roboto Slab"}
  includes:
    in_header: |
      <link rel="stylesheet" href="extra.css">

home:
  title: "varunayanR"
  description: >
    Download and process ERA5 and IMD climate data for custom regions with analysis-ready outputs.

  links:
  - text: Browse source code
    href: https://github.com/saketlab/varunayanR
  - text: Report a bug
    href: https://github.com/saketlab/varunayanR/issues

navbar:
  structure:
    left:  [intro, reference, articles, tutorials, news]
    right: [search, github, twitter]

  components:
    home:
      icon: fas fa-home fa-lg
      href: index.html

    reference:
      text: Reference
      href: reference/index.html

    articles:
      text: Articles
      menu:
      - text: Getting Started
        href: articles/getting-started.html
      - text: Quickstart Guide
        href: articles/quickstart.html
      - text: ERA5 vs IMD Comparison
        href: articles/era5-vs-imd-comparison.html

    news:
      text: Changelog
      href: news/index.html

    github:
      icon: fab fa-github fa-lg
      href: https://github.com/saketlab/varunayanR
      aria-label: GitHub

reference:
- title: "Main Functions"
  contents:
  - starts_with("era5ify")
  - starts_with("ERA5ify")
  - starts_with("imd_")
  - starts_with("IMD")

- title: "All Other Functions"
  contents:
  - lacks_concepts(c("internal"))

authors:
  Saket Choudhary:
    href: https://github.com/saketkc

footer:
  structure:
    left: developed_by
    right: built_with
  components:
    developed_by: "Developed by [Saket Lab](https://saketlab.org)"
    built_with: "Built with [pkgdown](https://pkgdown.r-lib.org/)"
