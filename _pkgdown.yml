home:
  title: "varunayanR - ERA5, IMD, HadEX3 & CRU TS Climate Data for R"
  description: >
    R package for downloading and processing climate reanalysis data from ERA5, IMD,
    HadEX3, and CRU TS for India. Extract data via bounding boxes, GeoJSON, or points.
    Calculate heat stress indices (WBGT, UTCI, Humidex, Wet Bulb).

  links:
  - text: Browse source code
    href: https://github.com/saketlab/varunayanR
  - text: Report a bug
    href: https://github.com/saketlab/varunayanR/issues

navbar:
  structure:
    left:  [intro, reference, articles, tutorials, news]
    right: [search, github, lightswitch]

  components:
    reference:
      text: Reference
      href: reference/index.html

    articles:
      text: Articles
      menu:
      - text: Quickstart Guide
        href: articles/quickstart.html
      - text: ERA5 vs IMD Comparison
        href: articles/era5-vs-imd-comparison.html
      - text: Visualising and aggregating grid data
        href: articles/spatial-aggregation.html
      - text: Heat stress indices comparison
        href: articles/heat-stress-indices.html
      - text: Country-level temperature trends
        href: articles/country-temperature.html
      - text: HadEX3 Climate Extremes
        href: articles/hadex3-climate-extremes.html
      - text: CRU TS vs ERA5 Comparison
        href: articles/cru-ts-comparison.html

    news:
      text: Changelog
      href: news/index.html

    github:
      icon: fab fa-github fa-lg
      href: https://github.com/saketlab/varunayanR
      aria-label: GitHub

reference:
- title: "ERA5 data functions"
  desc: "Download ERA5 reanalysis data from Copernicus climate data store"
  contents:
  - starts_with("era5ify")
  - starts_with("ERA5ify")
  - setup_cds_credentials

- title: "HadEX3 climate extremes functions"
  desc: "Download ETCCDI climate extremes from the Met Office HadEX3 dataset"
  contents:
  - starts_with("hadex3_")
  - starts_with("HadEX3")
  - list_hadex3_indices
  - ListHadEX3Indices

- title: "CRU TS gridded climate functions"
  desc: "Download monthly gridded climate data from the CRU TS v4.07 dataset"
  contents:
  - starts_with("cru_ts_")
  - starts_with("CRUTS")
  - list_cru_ts_variables
  - ListCRUTSVariables

- title: "IMD data functions"
  desc: "Download gridded climate data from Indian Meteorological Department"
  contents:
  - starts_with("imd_")
  - starts_with("IMD")

- title: "Variable discovery"
  desc: "Search and explore available climate variables"
  contents:
  - search_variable
  - describe_variables
  - list_available_variables

- title: "Cache management"
  desc: "Manage downloaded data cache"
  contents:
  - show_cache_info
  - clear_cache

- title: "All other functions"
  contents:
  - lacks_concepts(c("internal"))

authors:
  Saket Choudhary:
    href: https://github.com/saketkc

footer:
  structure:
    left: developed_by
    right: built_with
  components:
    developed_by: "Developed by [Saket Lab](https://saketlab.org)"
    built_with: "Built with [pkgdown](https://pkgdown.r-lib.org/)"
